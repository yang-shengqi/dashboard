<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow, nosnippet, noarchive">
    <title>Yang Shengqi's</title>
    <link rel="icon" href="images/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- 禁止缓存（合并重复项） -->
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />

    <style>
        /* ============================================================
         * 全局变量
         * ============================================================ */
        :root{
            --bg:            #09090b;
            --surface:       rgba(255,255,255,.04);
            --surface-2:     rgba(255,255,255,.07);
            --border:        rgba(255,255,255,.10);
            --border-2:      rgba(255,255,255,.18);

            --text:          #fafafa;
            --text-2:        #d4d4d8;
            --text-3:        #a1a1aa;

            --accent:        #0a84ff;
            --accent-2:      #30d158;
            --accent-violet: #5e5ce6;

            --r-md:          12px;
            --r-lg:          20px;
            --ease:          cubic-bezier(.22,1,.36,1);

            --font-mono:     ui-monospace, SFMono-Regular, "SF Mono",
                             Menlo, Consolas, monospace;
        }

        /* ============================================================
         * 重置
         * ============================================================ */
        *,*::before,*::after{ box-sizing: border-box; }
        html, body{ height: 100%; margin: 0; padding: 0; }

        body{
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "Inter", "PingFang SC", "Microsoft YaHei",
                         "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        /* ============================================================
         * 背景：色团 + 网格
         * ============================================================ */
        .bg{
            position: fixed;
            inset: -20%;
            z-index: 0;
            pointer-events: none;
            filter: blur(90px);
        }
        .bg .blob{
            position: absolute;
            border-radius: 50%;
            will-change: transform;
        }
        .bg .b1{
            width: 620px; height: 620px;
            top: -10%; left: -8%;
            background: radial-gradient(circle,
                rgba(10,132,255,.55), transparent 68%);
            animation: drift1 22s ease-in-out infinite alternate;
        }
        .bg .b2{
            width: 520px; height: 520px;
            top: 5%; right: -10%;
            background: radial-gradient(circle,
                rgba(94,92,230,.50), transparent 68%);
            animation: drift2 26s ease-in-out infinite alternate;
        }
        .bg .b3{
            width: 560px; height: 560px;
            bottom: -20%; left: 30%;
            background: radial-gradient(circle,
                rgba(48,209,88,.35), transparent 68%);
            animation: drift3 30s ease-in-out infinite alternate;
        }

        @keyframes drift1{
            0%,100%{ transform: translate3d(0,0,0) scale(1); }
            100%    { transform: translate3d(60px,40px,0) scale(1.12); }
        }
        @keyframes drift2{
            0%,100%{ transform: translate3d(0,0,0) scale(1); }
            100%    { transform: translate3d(-50px,60px,0) scale(1.15); }
        }
        @keyframes drift3{
            0%,100%{ transform: translate3d(0,0,0) scale(1); }
            100%    { transform: translate3d(40px,-50px,0) scale(1.10); }
        }

        .grid{
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 20%, transparent 78%);
                    mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 20%, transparent 78%);
        }

        /* ============================================================
         * 工具类（脚本依赖，不可删）
         * ============================================================ */
        .hidden{ display: none !important; }

        /* ============================================================
         * 加载屏
         * ============================================================ */
        #staticrypt_loading{
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
        }
        .spinner{
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,.10);
            border-top-color: var(--accent);
            border-right-color: rgba(10,132,255,.45);
            animation: spin .9s linear infinite;
        }
        @keyframes spin{ to{ transform: rotate(360deg); } }

        /* ============================================================
         * 内容容器
         * ============================================================ */
        #staticrypt_content{
            position: relative;
            z-index: 1;
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: 24px;
            animation: fadeUp .6s var(--ease) both;
        }
        @keyframes fadeUp{
            from{ opacity: 0; transform: translateY(16px); }
            to  { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
         * 登录卡片
         * ============================================================ */
        .card{
            position: relative;
            width: min(400px, 100%);
            padding: 40px 36px 32px;
            border-radius: var(--r-lg);
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow:
                0 1px 0 rgba(255,255,255,.06) inset,
                0 24px 60px -24px rgba(0,0,0,.75);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            overflow: hidden;
        }
        .card::before{
            content: "";
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg,
                transparent, var(--accent), var(--accent-violet), transparent);
            opacity: .7;
        }

        /* ---------- 品牌 ---------- */
        .brand{
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 26px;
        }
        .brand .mark{
            width: 30px;
            height: 30px;
            border-radius: 10px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            line-height: 1;
            padding-bottom: 1px;
            background: linear-gradient(145deg, var(--accent), var(--accent-violet));
            box-shadow:
                0 2px 12px rgba(10,132,255,.40),
                0 0 0 1px rgba(255,255,255,.08) inset;
        }
        .brand .name{
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -.01em;
            color: var(--text);
        }

        /* ---------- 标题 ---------- */
        .title{
            position: relative;            /* 供粒子绝对定位 */
            margin: 0 0 6px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.03em;
            background: linear-gradient(105deg,
                var(--text), var(--accent) 60%, var(--accent-violet));
            -webkit-background-clip: text;
                    background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        .sub{
            margin: 0 0 28px;
            font-size: 13px;
            color: var(--text-3);
        }

        /* ============================================================
         * 表单
         * ============================================================ */
        .form{ display: flex; flex-direction: column; gap: 14px; }

        .pwd{
            position: relative;
            border-radius: var(--r-md);
            border: 1px solid var(--border);
            background: var(--surface-2);
            transition: border-color .22s var(--ease),
                        box-shadow   .22s var(--ease),
                        background   .22s var(--ease);
        }
        .pwd:focus-within{
            border-color: rgba(10,132,255,.65);
            background: rgba(255,255,255,.09);
            box-shadow:
                0 0 0 3px rgba(10,132,255,.18),
                0 0 24px -4px rgba(10,132,255,.45);
        }
        .pwd input{
            width: 100%;
            height: 48px;
            padding: 0 48px 0 16px;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            letter-spacing: .02em;
        }
        .pwd input::placeholder{
            color: var(--text-3);
            letter-spacing: 0;
        }

        .staticrypt-toggle-password-visibility{
            position: absolute;
            top: 50%;
            right: 12px;
            width: 20px;
            height: 20px;
            padding: 0;
            margin: 0;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: .55;
            transition: opacity .2s var(--ease), transform .2s var(--ease);
            user-select: none;
        }
        .staticrypt-toggle-password-visibility:hover{
            opacity: 1;
            transform: translateY(-50%) scale(1.08);
        }
        /* 键盘聚焦时给出可见的焦点环 */
        .staticrypt-toggle-password-visibility:focus-visible{
            opacity: 1;
            outline: 2px solid rgba(10,132,255,.85);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* ---------- 记住我 ---------- */
        .remember{
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
            color: var(--text-2);
            cursor: pointer;
            user-select: none;
            padding: 2px 0;
        }
        .remember input[type="checkbox"]{
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            margin: 0;
            flex: 0 0 auto;
            border-radius: 5px;
            border: 1px solid var(--border-2);
            background: rgba(255,255,255,.05);
            cursor: pointer;
            position: relative;
            transition: background .18s var(--ease),
                        border-color .18s var(--ease);
        }
        .remember input[type="checkbox"]:hover{
            border-color: rgba(255,255,255,.30);
        }
        .remember input[type="checkbox"]:checked{
            background: var(--accent);
            border-color: var(--accent);
        }
        .remember input[type="checkbox"]:checked::after{
            content: "";
            position: absolute;
            left: 5px;
            top: 1px;
            width: 5px;
            height: 10px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* ---------- 提交按钮 ---------- */
        .submit{
            position: relative;
            height: 48px;
            border: 0;
            border-radius: var(--r-md);
            background: linear-gradient(115deg,
                var(--accent), var(--accent-violet));
            background-size: 180% 180%;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 650;
            letter-spacing: .18em;
            cursor: pointer;
            overflow: hidden;
            transition: transform .22s var(--ease),
                        box-shadow .22s var(--ease);
            box-shadow: 0 10px 28px -12px rgba(10,132,255,.65);
            animation: shift 8s ease infinite;
        }
        @keyframes shift{
            0%,100%{ background-position: 0% 50%; }
            50%    { background-position: 100% 50%; }
        }
        .submit:hover{
            transform: translateY(-1px);
            box-shadow: 0 16px 36px -12px rgba(10,132,255,.85);
        }
        .submit:active{
            transform: translateY(0) scale(.99);
        }
        .submit:focus-visible{
            outline: 2px solid rgba(255,255,255,.5);
            outline-offset: 2px;
        }
        .submit span{
            position: relative;
            z-index: 1;
        }
        .submit::after{
            content: "";
            position: absolute;
            top: 0; bottom: 0;
            left: -40%;
            width: 40%;
            background: linear-gradient(90deg,
                transparent, rgba(255,255,255,.35), transparent);
            animation: sweep 3.2s linear infinite;
            pointer-events: none;
        }
        @keyframes sweep{
            0%  { transform: translateX(0); }
            100%{ transform: translateX(360%); }
        }

        /* ============================================================
         * 页脚 + 运行时长
         * ============================================================ */
        .foot{
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 11.5px;
            letter-spacing: .06em;
            color: var(--text-3);
        }

        /* 运行时长：等宽字体 + 强调色 */
        .foot .timer{
            display: block;
            margin-bottom: 6px;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .02em;
            color: var(--text-2);
        }
        .foot .timer #display{
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        /* ============================================================
         * 响应式
         * ============================================================ */
        @media (max-width: 480px){
            #staticrypt_content{ padding: 16px; }
            .card{ padding: 32px 24px 26px; }
            .title{ font-size: 20px; }
        }

        /* ============================================================
         * 无障碍：减少动效
         * ============================================================ */
        @media (prefers-reduced-motion: reduce){
            .bg .blob,
            .submit,
            .submit::after,
            #staticrypt_content{
                animation: none !important;
            }
            .spinner{ animation-duration: 1.6s !important; }
        }

        /* ============================================================
         * 标题粒子（挂在 .title 上）
         * ============================================================ */
        .dust{
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, #fff,
                var(--pc, var(--accent)) 58%, transparent 72%);
            box-shadow: 0 0 8px var(--pc, var(--accent));
            filter: blur(.4px);
            animation-name: dustFloat;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }
        @keyframes dustFloat{
            0%   { transform: translate(0,0) scale(.5); opacity: 0; }
            18%  { opacity: .85; }
            78%  { opacity: .6; }
            100% { transform: translate(22px,-72px) scale(1.15); opacity: 0; }
        }

        /* ============================================================
         * 背景流星
         * ============================================================ */
        .meteor{
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0;

            --meteor-color: color-mix(in srgb, var(--accent) 60%, #ffffff);
            --meteor-glow:  color-mix(in srgb, var(--accent) 45%, transparent);

            animation-name: meteorFall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
            will-change: transform, opacity;
        }
        .meteor::after{
            content: "";
            display: block;
            width: 0;
            height: 0;
            border: solid;
            border-width: 0.3px 0 0.3px var(--len, 10px);
            border-color: transparent transparent transparent var(--meteor-color);
            border-radius: 1px 0 0 1px;
            transform: rotate(-45deg);
            transform-origin: 0 0;
            box-shadow: 0 0 2px var(--meteor-glow);
        }
        @keyframes meteorFall{
            0%   { transform: translate3d(0,0,0);           opacity: 0; }
            8%   { opacity: 1; }
            75%  { opacity: 1; }
            100% { transform: translate3d(-90vw, 65vh, 0);  opacity: 0; }
        }
    </style>
</head>

        <script>
            // these variables will be filled when generating the file - the template format is 'variable_name'
            const staticryptInitiator = 
            ((function(){
  const exports = {};
  const cryptoEngine = ((function(){
  const exports = {};
  const { subtle } = crypto;

const IV_BITS = 16 * 8;
const HEX_BITS = 4;
const ENCRYPTION_ALGO = "AES-CBC";

/**
 * Translates between utf8 encoded hexadecimal strings
 * and Uint8Array bytes.
 */
const HexEncoder = {
    /**
     * hex string -> bytes
     * @param {string} hexString
     * @returns {Uint8Array}
     */
    parse: function (hexString) {
        if (hexString.length % 2 !== 0) throw "Invalid hexString";
        const arrayBuffer = new Uint8Array(hexString.length / 2);

        for (let i = 0; i < hexString.length; i += 2) {
            const byteValue = parseInt(hexString.substring(i, i + 2), 16);
            if (isNaN(byteValue)) {
                throw "Invalid hexString";
            }
            arrayBuffer[i / 2] = byteValue;
        }
        return arrayBuffer;
    },

    /**
     * bytes -> hex string
     * @param {Uint8Array} bytes
     * @returns {string}
     */
    stringify: function (bytes) {
        const hexBytes = [];

        for (let i = 0; i < bytes.length; ++i) {
            let byteString = bytes[i].toString(16);
            if (byteString.length < 2) {
                byteString = "0" + byteString;
            }
            hexBytes.push(byteString);
        }
        return hexBytes.join("");
    },
};

/**
 * Translates between utf8 strings and Uint8Array bytes.
 */
const UTF8Encoder = {
    parse: function (str) {
        return new TextEncoder().encode(str);
    },

    stringify: function (bytes) {
        return new TextDecoder().decode(bytes);
    },
};

/**
 * Salt and encrypt a msg with a password.
 */
async function encrypt(msg, hashedPassword) {
    // Must be 16 bytes, unpredictable, and preferably cryptographically random. However, it need not be secret.
    // https://developer.mozilla.org/en-US/docs/Web/API/SubtleCrypto/encrypt#parameters
    const iv = crypto.getRandomValues(new Uint8Array(IV_BITS / 8));

    const key = await subtle.importKey("raw", HexEncoder.parse(hashedPassword), ENCRYPTION_ALGO, false, ["encrypt"]);

    const encrypted = await subtle.encrypt(
        {
            name: ENCRYPTION_ALGO,
            iv: iv,
        },
        key,
        UTF8Encoder.parse(msg)
    );

    // iv will be 32 hex characters, we prepend it to the ciphertext for use in decryption
    return HexEncoder.stringify(iv) + HexEncoder.stringify(new Uint8Array(encrypted));
}
exports.encrypt = encrypt;

/**
 * Decrypt a salted msg using a password.
 *
 * @param {string} encryptedMsg
 * @param {string} hashedPassword
 * @returns {Promise<string>}
 */
async function decrypt(encryptedMsg, hashedPassword) {
    const ivLength = IV_BITS / HEX_BITS;
    const iv = HexEncoder.parse(encryptedMsg.substring(0, ivLength));
    const encrypted = encryptedMsg.substring(ivLength);

    const key = await subtle.importKey("raw", HexEncoder.parse(hashedPassword), ENCRYPTION_ALGO, false, ["decrypt"]);

    const outBuffer = await subtle.decrypt(
        {
            name: ENCRYPTION_ALGO,
            iv: iv,
        },
        key,
        HexEncoder.parse(encrypted)
    );

    return UTF8Encoder.stringify(new Uint8Array(outBuffer));
}

    <script>
    /* 登录页特效：标题粒子 + 背景流星 + 运行时长 */
    (function(){
      'use strict';

      var reduceMotion = window.matchMedia &&
                         window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* ---------- 1. 标题粒子 ---------- */
      (function(){
        if (reduceMotion) return;

        var title = document.querySelector('.title');
        if (!title) return;

        var COLS = ['var(--accent)', 'var(--accent-2)', 'var(--accent-violet)'];
        var frag = document.createDocumentFragment();

        for (var i = 0; i < 28; i++){
          var p = document.createElement('span');
          p.className = 'dust';
          p.setAttribute('aria-hidden', 'true');

          var size = 2 + Math.random() * 3;
          p.style.setProperty('--pc', COLS[Math.floor(Math.random() * 3)]);
          p.style.left   = (Math.random() * 100).toFixed(1) + '%';
          p.style.top    = (30 + Math.random() * 70).toFixed(1) + '%';
          p.style.width  = size.toFixed(1) + 'px';
          p.style.height = size.toFixed(1) + 'px';
          p.style.animationDuration = (6 + Math.random() * 8).toFixed(1) + 's';
          p.style.animationDelay    = (-Math.random() * 12).toFixed(1) + 's';
          frag.appendChild(p);
        }
        title.appendChild(frag);
      })();

      /* ---------- 2. 背景流星 ---------- */
      (function(){
        if (reduceMotion) return;

        var MIN_GAP        = 800;    /* 两颗流星最小间隔（ms） */
        var MAX_GAP        = 2000;   /* 两颗流星最大间隔（ms） */
        var MAX_CONCURRENT = 12;     /* 同时存在的上限 */
        var DUR_MIN        = 2.2;    /* 最短飞行时长（秒） */
        var DUR_MAX        = 10;     /* 最长飞行时长（秒） */
        var LEN_MIN        = 10;     /* 最短尾巴（px） */
        var LEN_MAX        = 30;     /* 最长尾巴（px） */

        var active = 0;

        function spawn(){
          if (active >= MAX_CONCURRENT || document.hidden){ schedule(); return; }

          var el = document.createElement('div');
          el.className = 'meteor';
          el.setAttribute('aria-hidden', 'true');

          el.style.left = (30 + Math.random() * 80) + 'vw';
          el.style.top  = (-15 + Math.random() * 45) + 'vh';

          var len = LEN_MIN + Math.random() * (LEN_MAX - LEN_MIN);
          var dur = DUR_MIN + Math.random() * (DUR_MAX - DUR_MIN);
          el.style.setProperty('--len', len.toFixed(0) + 'px');
          el.style.animationDuration = dur.toFixed(2) + 's';

          document.body.appendChild(el);
          active++;

          el.addEventListener('animationend', function(){
            active--;
            if (el.parentNode) el.parentNode.removeChild(el);
          });

          schedule();
        }

        function schedule(){
          setTimeout(spawn, MIN_GAP + Math.random() * (MAX_GAP - MIN_GAP));
        }

        schedule();
      })();

      /* ---------- 3. 运行时长 ---------- */
      (function(){
        var startDate = new Date(2025, 11, 1, 0, 0, 0);  // 2025-12-01 00:00:00 本地时间
        var display = document.getElementById('display');
        if (!display) return;

        function pad(n){ return String(n).padStart(2, '0'); }

        function format(ms){
          var s = Math.floor(ms / 1000);
          var d = Math.floor(s / 86400);
          var h = Math.floor((s % 86400) / 3600);
          var m = Math.floor((s % 3600) / 60);
          var ss = s % 60;
          return d + 'D ' + pad(h) + ':' + pad(m) + ':' + pad(ss);
        }

        function render(){
          display.textContent = format(Date.now() - startDate.getTime());
        }

        render();
        setInterval(render, 1000);
      })();

    })();
    </script>
